databaseChangeLog:
  - changeSet:
      id: 012-create-user-looped-events
      author: loopin
      changes:
        - createTable:
            tableName: user_looped_events
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, primaryKeyName: pk_user_looped_events, nullable: false } }
              - column: { name: public_id, type: UUID, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: updated_at, type: TIMESTAMP, constraints: { nullable: false } }
              - column: { name: deleted_at, type: TIMESTAMP }
              - column: { name: user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: event_id, type: BIGINT, constraints: { nullable: false } }
        - addUniqueConstraint:
            tableName: user_looped_events
            columnNames: public_id
            constraintName: uk_user_looped_events_public_id
        - addUniqueConstraint:
            tableName: user_looped_events
            columnNames: user_id,event_id
            constraintName: uk_user_looped_events_user_event
        - addForeignKeyConstraint:
            baseTableName: user_looped_events
            baseColumnNames: user_id
            constraintName: fk_user_looped_events_user_id
            referencedTableName: users
            referencedColumnNames: id
            onDelete: CASCADE
        - addForeignKeyConstraint:
            baseTableName: user_looped_events
            baseColumnNames: event_id
            constraintName: fk_user_looped_events_event_id
            referencedTableName: events
            referencedColumnNames: id
            onDelete: CASCADE
      rollback:
        - dropTable:
            tableName: user_looped_events
