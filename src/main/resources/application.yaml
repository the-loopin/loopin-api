server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: loopin-api

  # Persistence Engine Datastore Mapping
  datasource:
    url: ${DATABASE_URL:jdbc:h2:mem:loopindb;DB_CLOSE_DELAY=-1}
    driver-class-name: org.h2.Driver
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:}

  # Embedded H2 Database Web Panel Management
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false

  # Object Relational Mapping (ORM) Definitions
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Local Content Check Rule Targets
moderation:
  banned-words: ${BANNED_WORDS_LIST:scam,spam,offensiveword1,offensiveword2}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  policies:
    - name: auth
      requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
      window: ${RATE_LIMIT_AUTH_WINDOW:1m}
      methods:
        - POST
      paths:
        - /auth/**
        - /users/register
    - name: public-read
      requests: ${RATE_LIMIT_PUBLIC_READ_REQUESTS:120}
      window: ${RATE_LIMIT_PUBLIC_READ_WINDOW:1m}
      methods:
        - GET
      paths:
        - /events/**
        - /groups/**
    - name: authenticated-write
      requests: ${RATE_LIMIT_AUTHENTICATED_WRITE_REQUESTS:60}
      window: ${RATE_LIMIT_AUTHENTICATED_WRITE_WINDOW:1m}
      methods:
        - POST
        - PUT
        - PATCH
        - DELETE
      paths:
        - /events/**
        - /groups/**
