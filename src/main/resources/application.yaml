server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: loopin-api

  data:
    redis:
      repositories:
        enabled: false
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  # PostgreSQL persistence configuration. Override all values per environment.
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/loopin}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USERNAME:loopin}
    password: ${DATABASE_PASSWORD:}

  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
    enabled: ${LIQUIBASE_ENABLED:true}
    contexts: ${LIQUIBASE_CONTEXTS:}

  # ORM validates mappings only; schema changes are managed by Liquibase.
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL:false}
        default_batch_fetch_size: 20

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
    enable:
      hikaricp: true
      http.server.requests: true
      jvm: true
      system: true
  endpoint:
    health:
      # Keep health responses safe for the publicly reachable probe endpoints.
      show-details: never
      probes:
        enabled: true
      group:
        # Liveness is process-only so transient database, cache, or network failures
        # never cause the deployment platform to restart a healthy JVM.
        liveness:
          include: livenessState
        # The database is required for the API to serve its core requests.
        readiness:
          include: readinessState,db

# Local Content Check Rule Targets
moderation:
  banned-words: ${BANNED_WORDS_LIST:scam,spam,offensiveword1,offensiveword2}
  ai:
    enabled: ${AI_MODERATION_ENABLED:false}
    base-url: ${AI_MODERATION_BASE_URL:}
    endpoint-path: ${AI_MODERATION_ENDPOINT_PATH:/v1/moderation/check}
    timeout: ${AI_MODERATION_TIMEOUT:2s}
    api-key: ${AI_MODERATION_API_KEY:}

rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  storage: ${RATE_LIMIT_STORAGE:local}
  key-prefix: ${RATE_LIMIT_KEY_PREFIX:loopin:rate-limit}
  trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}
  policies:
    - name: auth
      requests: ${RATE_LIMIT_AUTH_REQUESTS:10}
      window: ${RATE_LIMIT_AUTH_WINDOW:1m}
      methods:
        - POST
      paths:
        - /v1/auth/**
        - /v1/users/register
    - name: public-read
      requests: ${RATE_LIMIT_PUBLIC_READ_REQUESTS:120}
      window: ${RATE_LIMIT_PUBLIC_READ_WINDOW:1m}
      methods:
        - GET
      paths:
        - /v1/events/**
        - /v1/groups/**
    - name: authenticated-write
      requests: ${RATE_LIMIT_AUTHENTICATED_WRITE_REQUESTS:60}
      window: ${RATE_LIMIT_AUTHENTICATED_WRITE_WINDOW:1m}
      methods:
        - POST
        - PUT
        - PATCH
        - DELETE
      paths:
        - /v1/events/**
        - /v1/groups/**

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}

google:
  client-id: ${GOOGLE_CLIENT_ID}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
loopin:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://localhost:9000}
    presign-endpoint: ${STORAGE_PRESIGN_ENDPOINT:${STORAGE_ENDPOINT:http://localhost:9000}}
    region: ${STORAGE_REGION:us-east-1}
    bucket: ${STORAGE_BUCKET:loopin-media}
    access-key: ${STORAGE_ACCESS_KEY:loopin-minio}
    secret-key: ${STORAGE_SECRET_KEY:loopin-minio-local-password}
    path-style-access: ${STORAGE_PATH_STYLE_ACCESS:true}
    upload-url-ttl: ${STORAGE_UPLOAD_URL_TTL:10m}
  seed:
    enabled: ${SEED_DATA_ENABLED:false}
  group-retention:
    archived-cleanup-days: ${GROUP_ARCHIVE_RETENTION_DAYS:30}
    cleanup-fixed-delay-ms: ${GROUP_ARCHIVE_CLEANUP_FIXED_DELAY_MS:86400000}
    cleanup-initial-delay-ms: ${GROUP_ARCHIVE_CLEANUP_INITIAL_DELAY_MS:300000}
  notifications:
    reminders:
      fixed-delay-ms: ${NOTIFICATION_REMINDER_DELAY_MS:300000}
      initial-delay-ms: ${NOTIFICATION_REMINDER_INITIAL_DELAY_MS:60000}
    n8n:
      enabled: ${N8N_NOTIFICATIONS_ENABLED:false}
      webhook-url: ${N8N_NOTIFICATION_WEBHOOK_URL:http://localhost:5678/webhook/loopin-notifications}
      secret: ${N8N_NOTIFICATION_WEBHOOK_SECRET:}
      timeout: ${N8N_NOTIFICATION_TIMEOUT:5s}
      batch-size: ${N8N_NOTIFICATION_BATCH_SIZE:50}
      max-backoff: ${N8N_NOTIFICATION_MAX_BACKOFF:1h}
      worker-delay-ms: ${N8N_NOTIFICATION_WORKER_DELAY_MS:10000}
      worker-initial-delay-ms: ${N8N_NOTIFICATION_WORKER_INITIAL_DELAY_MS:10000}
  ai:
    base-url: ${LOOPIN_AI_BASE_URL:http://localhost:8000}
    timeout: ${LOOPIN_AI_TIMEOUT:2s}
    embedding-model: ${LOOPIN_AI_EMBEDDING_MODEL:intfloat/multilingual-e5-small}
    service-token: ${LOOPIN_AI_SERVICE_TOKEN:}
    embedding-jobs:
      enabled: ${LOOPIN_AI_EMBEDDING_JOBS_ENABLED:true}
      batch-size: ${LOOPIN_AI_EMBEDDING_BATCH_SIZE:25}
      max-attempts: ${LOOPIN_AI_EMBEDDING_MAX_ATTEMPTS:8}
      initial-backoff: ${LOOPIN_AI_EMBEDDING_INITIAL_BACKOFF:5s}
      max-backoff: ${LOOPIN_AI_EMBEDDING_MAX_BACKOFF:30m}
      processing-timeout: ${LOOPIN_AI_EMBEDDING_PROCESSING_TIMEOUT:5m}
      backoff-jitter: ${LOOPIN_AI_EMBEDDING_BACKOFF_JITTER:0.2}
      embedding-dimensions: ${LOOPIN_AI_EMBEDDING_DIMENSIONS:384}
      batch-enabled: ${LOOPIN_AI_EMBEDDING_BATCH_ENABLED:true}
      ai-batch-size: ${LOOPIN_AI_EMBEDDING_AI_BATCH_SIZE:32}
      worker-delay-ms: ${LOOPIN_AI_EMBEDDING_WORKER_DELAY_MS:5000}
      worker-initial-delay-ms: ${LOOPIN_AI_EMBEDDING_WORKER_INITIAL_DELAY_MS:5000}
  observability:
    prometheus:
      # Configure a long, randomly generated secret through PROMETHEUS_SCRAPE_TOKEN.
      # When it is absent, the endpoint remains inaccessible rather than falling back to user JWTs.
      scrape-token: ${PROMETHEUS_SCRAPE_TOKEN:}
