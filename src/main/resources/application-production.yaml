spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  liquibase:
    contexts: production

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
