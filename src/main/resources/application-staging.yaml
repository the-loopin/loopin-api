spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  liquibase:
    contexts: staging

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        application: ${spring.application.name}
      rename:
        "@timestamp": timestamp
        logger_name: logger
        thread_name: threadName
        stack_trace: exception

management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,db,redis

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}
