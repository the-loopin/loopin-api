name: loopin-production-smoke

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: loopin_smoke
      POSTGRES_USER: loopin_smoke
      POSTGRES_PASSWORD: loopin_smoke_password
    volumes:
      - smoke-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no"]
    volumes:
      - smoke-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  api:
    image: ${SMOKE_API_IMAGE:-loopin-api:ci}
    environment:
      SPRING_PROFILES_ACTIVE: production
      SERVER_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/loopin_smoke
      DATABASE_USERNAME: loopin_smoke
      DATABASE_PASSWORD: loopin_smoke_password
      LOOPIN_AI_EMBEDDING_JOBS_ENABLED: "false"
      LIQUIBASE_ENABLED: "true"
      LIQUIBASE_CONTEXTS: production
      RATE_LIMIT_STORAGE: redis
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # These are intentionally non-sensitive CI-only values, not deployment secrets.
      JWT_SECRET: ci-only-jwt-signing-key-must-be-at-least-32-bytes-long
      GOOGLE_CLIENT_ID: ci-smoke-test.apps.googleusercontent.com
      CORS_ALLOWED_ORIGINS: http://localhost
      PROMETHEUS_SCRAPE_TOKEN: ci-only-prometheus-scrape-token
      N8N_NOTIFICATIONS_ENABLED: "false"
      AI_MODERATION_ENABLED: "false"
    ports:
      - "127.0.0.1:${SMOKE_API_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  smoke-postgres-data:
  smoke-redis-data:
